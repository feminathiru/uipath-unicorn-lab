<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find Your Unicorn Name - Practice</title><style>body{font:16px Arial,sans-serif;background:#f4f7fc;color:#24334a;margin:0;padding:45px}main{max-width:760px;margin:auto;background:white;padding:35px;border-radius:12px;box-shadow:0 5px 24px #ccd4e2}h1{color:#263b70}section{display:grid;grid-template-columns:1fr 1fr;gap:35px}label{display:block;margin:18px 0 8px;font-weight:bold}input,select{width:100%;padding:12px;border:1px solid #9ba9bf;border-radius:5px;box-sizing:border-box}button{background:#1674cf;color:white;border:0;padding:12px 24px;border-radius:5px;margin-top:20px;cursor:pointer}#result{font-size:24px;font-weight:bold;color:#663f9e;min-height:55px}@media(max-width:600px){section{grid-template-columns:1fr}}</style></head><body><main><h1>Find Your Unicorn Name</h1><p>An app for learning UI Automation with UiPath (practice replica)</p><section><div><h2>Your Info</h2><label for="name">What is your name?*</label><input id="name" placeholder="Enter your name" required><label for="month">What month is your birthday?</label><select id="month"><option value="">Select</option><option>January</option><option>February</option><option>March</option><option>April</option><option>May</option><option>June</option><option>July</option><option>August</option><option>September</option><option>October</option><option>November</option><option>December</option></select><button id="generate">Get Name</button></div><div><h2>Your Unicorn Name</h2><div id="result">[Unicorn Name]</div><p>Name: <span id="outname"></span></p><p>Month: <span id="outmonth"></span></p></div></section></main><script>document.getElementById('generate').addEventListener('click',()=>{const n=document.getElementById('name').value.trim(),m=document.getElementById('month').value;if(!n){alert('Please enter your name');return}const a=['Sparkle','Moon','Starlight','Crystal','Rainbow','Silver','Golden','Mystic','Twinkle','Dream','Velvet','Shimmer'];const b=['Hoof','Mane','Wish','Dancer','Glow','Whisper','Blossom','Star','Cloud','Heart','Magic','Song'];let idx=m?document.getElementById('month').selectedIndex-1:0;document.getElementById('result').textContent=a[idx]+' '+b[[...n.toLowerCase()].reduce((s,c)=>s+c.charCodeAt(0),0)%12];document.getElementById('outname').textContent=n;document.getElementById('outmonth').textContent=m||'Not selected';});</script></body></html>
